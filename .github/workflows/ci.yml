name: CI Verification & Safety Gates

on:
  push:
    branches:
      - main
      - master
      - 'stabilization/**'
      - 'development/**'
      - 'fix/**'
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Type Check & Lint (Gate 1)
        run: npm run lint

      - name: Run Test Suite (Gate 2)
        run: npm test

      - name: Portable SQL and RLS in isolated PostgreSQL WASM
        run: npm run test:sql

      - name: Build Web Application Bundle (Gate 3)
        run: npm run build

  portable-postgres:
    name: Native PostgreSQL 17 replay, isolation and restore
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: hisab_contract_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hisab_contract_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HISAB_SQL_TEST_MODE: isolated
      HISAB_TEST_PG_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/hisab_contract_test
      HISAB_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Replay migrations and verify two-owner RLS, exact journal and concurrent retries
        run: npm run test:sql
      - name: Scoped pg_dump/pg_restore into a separate fresh database
        run: npm run test:sql-restore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-postgres-synthetic-evidence
          path: build/pr2/native-restore-evidence.json
          if-no-files-found: ignore
