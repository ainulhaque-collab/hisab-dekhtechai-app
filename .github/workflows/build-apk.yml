name: Build Android APK

on:
  push:
    branches:
      - main
      - master
      - antigravity
      - 'stabilization/**'
      - 'development/**'
      - 'fix/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Web Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Verify Types and Accounting Regressions
        run: |
          npm run lint
          npm test

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Outputs
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/hisab-dekhtechai-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hisab-DekhteChai-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            apk-output/hisab-dekhtechai-debug.apk
          retention-days: 14

      - name: Record Build and Signing Evidence
        run: |
          mkdir -p qa-evidence
          printf 'Commit: %s\nPackage: com.hisabdekhtechai.app.debug\nVersion: 1.0.1-dev (2)\n' "$GITHUB_SHA" > qa-evidence/build.txt
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk >> qa-evidence/build.txt
          APKSIGNER_BIN=$(find "$ANDROID_HOME/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$APKSIGNER_BIN" ]; then
            "$APKSIGNER_BIN" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk >> qa-evidence/build.txt || true
          fi
          printf '\nPhysical device, Google owner/Drive roundtrip, face/fingerprint, and in-place upgrade: NOT VERIFIED\nDebug signing continuity with previous APK: NOT VERIFIED\n' >> qa-evidence/build.txt

      - name: Upload QA Evidence
        uses: actions/upload-artifact@v4
        with:
          name: Hisab-DekhteChai-QA-Evidence
          path: qa-evidence/
          retention-days: 14

      # Customer releases use a separately reviewed signed build and owner approval.
      # Debug artifacts must never be automatically published as a public release.
