plugins {
    id 'com.android.application'
}

def signingFile = System.getenv('HISAB_ANDROID_KEYSTORE_FILE')
def signingStorePassword = System.getenv('HISAB_ANDROID_STORE_PASSWORD')
def signingAlias = System.getenv('HISAB_ANDROID_KEY_ALIAS')
def signingKeyPassword = System.getenv('HISAB_ANDROID_KEY_PASSWORD')
def signingReady = signingFile && signingStorePassword && signingAlias && signingKeyPassword
def requestedVersion = System.getenv('HISAB_ANDROID_VERSION_CODE')
if (requestedVersion && (!(requestedVersion ==~ /[1-9][0-9]*/) || requestedVersion.toLong() > 2100000000L)) {
    throw new GradleException('HISAB_ANDROID_VERSION_CODE must be a positive Android version code.')
}

android {
    namespace "com.hisabdekhtechai.app"
    compileSdk 36

    defaultConfig {
        applicationId "com.hisabdekhtechai.app"
        minSdk 24
        targetSdk 36
        versionCode requestedVersion ? requestedVersion.toInteger() : 2
        versionName System.getenv('HISAB_ANDROID_VERSION_NAME') ?: "1.0.1-dev"
        testInstrumentationRunner "com.hisabdekhtechai.app.MediaBridgeProbe"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        if (signingReady) {
            localRelease {
                storeFile file(signingFile)
                storeType 'PKCS12'
                storePassword signingStorePassword
                keyAlias signingAlias
                keyPassword signingKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (signingReady) signingConfig signingConfigs.localRelease
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }
    // Opt-in, read-only bridge instrumentation against the actual minified APK.
    if (project.hasProperty('hisabMediaProbe')) testBuildType 'release'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project.path == ':app' && it.name.toLowerCase().contains('release') }) {
        if (!signingReady || !file(signingFile).isFile()) {
            throw new GradleException('Release signing is unavailable. Use the local signed-build script; never distribute an unsigned/debug substitute.')
        }
        if (!requestedVersion || requestedVersion.toInteger() <= 2 || !System.getenv('HISAB_ANDROID_VERSION_NAME')) {
            throw new GradleException('A release requires an explicit version name and versionCode greater than the development baseline (2).')
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.work:work-runtime:2.9.0'
    implementation 'com.google.android.gms:play-services-auth:22.0.0'
    implementation project(':capacitor-android')
    testImplementation 'junit:junit:4.13.2'
    if (!project.hasProperty('hisabMediaProbe')) {
        androidTestImplementation 'androidx.test.ext:junit:1.1.5'
        androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    }
}

// Include generated native plugin dependencies, including the existing SQLite driver.
apply from: 'capacitor.build.gradle'
